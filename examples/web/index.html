<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    /* --- Core Variables & Theme Definitions --- */
    :root {
      --bg: #0b1018;
      --panel: #0f172a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --accent: #16c27c;
      --bubble-user: #16c27c;
      --bubble-assistant: #1f2937;
      --input-bg: #0b121d;
      --shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    body.light {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text: #1f2937;
      --text-muted: #6b7280;
      --accent: #10b981;
      --bubble-user: #10b981;
      --bubble-assistant: #e5e7eb;
      --input-bg: #f9fafb;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; transition: background 0.2s, color 0.2s; }
    
    body {
      margin: 0;
      font-family: "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      padding: 15px;
    }

    /* --- Layout Container --- */
    .shell {
      width: min(960px, 100%);
      height: 94vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
    }

    header h1 { font-size: 16px; margin: 0; font-weight: 600; }

    .header-tools { display: flex; gap: 8px; }

    /* --- Chat History Area --- */
    #log {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; }

    .bubble {
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .user .bubble { background: var(--bubble-user); color: #05160d; font-weight: 500; border-bottom-right-radius: 2px; }
    .assistant .bubble { background: var(--bubble-assistant); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

    /* Think Tags & Generated Media */
    details.think { margin-top: 8px; background: rgba(0,0,0,0.1); border-radius: 8px; padding: 8px; border-left: 3px solid var(--accent); }
    details.think summary { cursor: pointer; color: var(--text-muted); font-size: 12px; }
    details.think pre { margin-top: 6px; font-size: 13px; color: var(--text-muted); white-space: pre-wrap; }
    img.generated { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }

    /* --- Bottom Control Bar --- */
    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.05);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }
    .bar input[type="checkbox"] { accent-color: var(--accent); }

    /* --- Input Area --- */
    .input-container {
      padding: 16px;
      background: var(--input-bg);
      border-top: 1px solid var(--border);
    }

    textarea {
      width: 100%;
      min-height: 70px;
      max-height: 200px;
      background: transparent;
      border: none;
      color: var(--text);
      resize: vertical;
      outline: none;
      font-size: 15px;
      padding-bottom: 10px;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 8px;
    }

    /* --- Professional Send Button Group --- */
    .btn-group {
      display: flex;
      background: var(--accent);
      border-radius: 8px;
      position: relative;
    }

    #send-btn {
      background: transparent;
      border: none;
      color: #05160d;
      padding: 8px 18px;
      cursor: pointer;
      font-weight: 700;
      border-right: 1px solid rgba(0,0,0,0.1);
    }

    .dropdown-trigger {
      background: transparent;
      border: none;
      color: #05160d;
      padding: 0 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 10px;
    }

    .dropdown-menu {
      position: absolute;
      bottom: 120%;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      width: 220px;
      display: none;
      z-index: 100;
    }
    .dropdown-menu.show { display: block; }

    .menu-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .menu-item:hover { background: rgba(255,255,255,0.05); }
    body.light .menu-item:hover { background: rgba(0,0,0,0.05); }
    .menu-item.active::after { content: '✓'; font-weight: bold; color: var(--accent); }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body class="dark">

<div class="shell">
  <header>
    <h1 id="ui-title">Chat AI</h1>
    <div class="header-tools">
      <button class="icon-btn" onclick="toggleLanguage()" id="ui-lang-btn">🌐 Language</button>
      <button class="icon-btn" onclick="toggleTheme()" id="ui-theme-btn">🌓 Style</button>
    </div>
  </header>

  <div id="log"></div>

  <div class="bar">
    <label><input type="checkbox" id="stream" checked> <span id="ui-stream">Stream</span></label>
    <label><input type="checkbox" id="think"> <span id="ui-think">Disable Think</span></label>
    <label><input type="checkbox" id="imgBase64" checked> <span id="ui-img">Base64</span></label>
  </div>

  <div class="input-container">
    <textarea id="input"></textarea>
    <div class="action-row">
      <div class="btn-group">
        <button id="send-btn" onclick="handleSendClick()">Send</button>
        <button class="dropdown-trigger" id="drop-trigger">▼</button>
        
        <div class="dropdown-menu" id="drop-menu">
          <div class="menu-item" data-mode="enter" id="ui-menu-enter">Press Enter to send</div>
          <div class="menu-item" data-mode="alt-enter" id="ui-menu-alt">Press Alt+Enter to send</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  /**
   * Translation Resources
   */
  const i18n = {
    'zh-CN': {
      title: 'AI智能对话',
      langBtn: '🌐 切换语言',
      themeBtn: '🌓 切换主题',
      stream: '流式输出',
      think: '禁用思考',
      img: 'Base64图片',
      send: '发送',
      placeholderEnter: '输入内容... (Enter 发送, Alt+Enter 换行)',
      placeholderAlt: '输入内容... (Alt+Enter 发送, Enter 换行)',
      menuEnter: '按Enter键发送',
      menuAlt: '按Alt+Enter键发送',
      statusConnecting: '…正在连接服务器',
      statusError: '发送失败：',
      thinkTitle: '思考过程',
      thinkGenerating: '思考过程（生成中）',
      generatedImg: '生成的图片：'
    },
    'en': {
      title: 'AI Chat',
      langBtn: '🌐 Language',
      themeBtn: '🌓 Style',
      stream: 'Streaming',
      think: 'No Thinking',
      img: 'Base64 Img',
      send: 'Send',
      placeholderEnter: 'Type message... (Enter to send, Alt+Enter for new line)',
      placeholderAlt: 'Type message... (Alt+Enter to send, Enter for new line)',
      menuEnter: 'Press Enter to send',
      menuAlt: 'Press Alt+Enter to send',
      statusConnecting: '...Connecting to server',
      statusError: 'Error: ',
      thinkTitle: 'Thinking Process',
      thinkGenerating: 'Thinking (Generating...)',
      generatedImg: 'Generated Image: '
    }
  };

  /**
   * UI Elements & State
   */
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const streamBox = document.getElementById('stream');
  const thinkBox = document.getElementById('think');
  const imgBase64Box = document.getElementById('imgBase64');
  const dropTrigger = document.getElementById('drop-trigger');
  const dropMenu = document.getElementById('drop-menu');
  const menuItems = document.querySelectorAll('.menu-item');

  const history = [];
  const renderedArtifacts = new Set();

  /**
   * Cookie Management
   */
  function setCookie(name, value) {
    document.cookie = `${name}=${value};path=/;max-age=${60*60*24*365}`;
  }
  function getCookie(name) {
    const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
    return v ? v[2] : null;
  }

  // Detect browser language or load from cookie
  let currentLang = getCookie('chat_lang');
  if (!currentLang) {
    currentLang = navigator.language.startsWith('zh') ? 'zh-CN' : 'en';
  }
  let currentShortcut = getCookie('chat_shortcut') || 'enter';
  let currentTheme = getCookie('chat_theme') || 'dark';

  /**
   * UI Update Logic
   */
  function applySettings() {
    const t = i18n[currentLang];
    
    // Theme
    document.body.className = currentTheme;
    
    // Localization
    document.getElementById('ui-title').innerText = t.title;
    document.getElementById('ui-lang-btn').innerText = t.langBtn;
    document.getElementById('ui-theme-btn').innerText = t.themeBtn;
    document.getElementById('ui-stream').innerText = t.stream;
    document.getElementById('ui-think').innerText = t.think;
    document.getElementById('ui-img').innerText = t.img;
    document.getElementById('send-btn').innerText = t.send;
    document.getElementById('ui-menu-enter').innerText = t.menuEnter;
    document.getElementById('ui-menu-alt').innerText = t.menuAlt;

    // Shortcut UI
    menuItems.forEach(item => {
      item.classList.toggle('active', item.dataset.mode === currentShortcut);
    });
    input.placeholder = currentShortcut === 'enter' ? t.placeholderEnter : t.placeholderAlt;
  }

  function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'zh-CN' : 'en';
    setCookie('chat_lang', currentLang);
    applySettings();
  }

  function toggleTheme() {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setCookie('chat_theme', currentTheme);
    applySettings();
  }

  // Initial UI Setup
  applySettings();

  /**
   * Dropdown Menu Handlers
   */
  dropTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    const isShowing = dropMenu.classList.toggle('show');
    dropTrigger.textContent = isShowing ? '▲' : '▼';
  });

  document.addEventListener('click', () => {
    dropMenu.classList.remove('show');
    dropTrigger.textContent = '▼';
  });

  menuItems.forEach(item => {
    item.addEventListener('click', () => {
      currentShortcut = item.dataset.mode;
      setCookie('chat_shortcut', currentShortcut);
      applySettings();
    });
  });

  /**
   * Core Messaging Logic (Restored from your version)
   */
  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderAssistantStreaming(raw) {
    if (!raw) return '';
    const t = i18n[currentLang];
    let html = '';
    let pos = 0;
    while (pos < raw.length) {
      const start = raw.indexOf('<think>', pos);
      if (start === -1) {
        html += escapeHtml(raw.slice(pos));
        break;
      }
      html += escapeHtml(raw.slice(pos, start));
      const close = raw.indexOf('</think>', start + 7);
      if (close === -1) {
        const thinkText = raw.slice(start + 7);
        html += `<details class="think" open><summary>${t.thinkGenerating}</summary><pre>${escapeHtml(thinkText)}</pre></details>`;
        pos = raw.length;
        break;
      } else {
        const thinkText = raw.slice(start + 7, close);
        html += `<details class="think"><summary>${t.thinkTitle}</summary><pre>${escapeHtml(thinkText)}</pre></details>`;
        pos = close + 8;
      }
    }
    return html || '&nbsp;';
  }

  function addMessage(role, text, allowHTML = false) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
    wrap.innerHTML = `<div class="bubble"></div>`;
    const bubble = wrap.querySelector('.bubble');
    if (allowHTML) bubble.innerHTML = text;
    else bubble.textContent = text;
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function updateLastAssistantHTML(html) {
    const bubbles = log.querySelectorAll('.msg.assistant .bubble');
    if (bubbles.length) {
      bubbles[bubbles.length - 1].innerHTML = html;
      log.scrollTop = log.scrollHeight;
    }
  }

  function renderArtifacts(artifacts) {
    if (!Array.isArray(artifacts)) return;
    const t = i18n[currentLang];
    for (const a of artifacts) {
      if (!a || typeof a !== 'object') continue;
      const mime = a.mime_type || 'image/png';
      const isImage = (a.kind === 'image') || (typeof mime === 'string' && mime.startsWith('image/'));
      if (!isImage) continue;
      let src = '';
      if (typeof a.url === 'string' && a.url) src = a.url;
      else if (typeof a.data_base64 === 'string' && a.data_base64) src = `data:${mime};base64,${a.data_base64}`;
      if (!src || renderedArtifacts.has(src)) continue;
      renderedArtifacts.add(src);
      addMessage('assistant', `${t.generatedImg}<img class="generated" src="${src}">`, true);
    }
  }

  async function sendMessage(content) {
    if (!content.trim()) return;
    sendBtn.disabled = true;
    const t = i18n[currentLang];
    
    const stream = streamBox.checked;
    const disableThinking = thinkBox.checked;
    const imageDelivery = imgBase64Box.checked ? 'base64' : 'file';

    history.push({ role: 'user', content });
    addMessage('user', content);
    addMessage('assistant', t.statusConnecting);

    const payload = {
      messages: [{ role: 'system', content: 'You are a professional and helpful assistant.' }, ...history],
      stream,
      enable_thinking: !disableThinking,
      mcp_image_delivery: imageDelivery,
      temperature: 0.7,
      top_p: 0.9
    };

    let assistantText = '';
    try {
      const resp = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (!resp.ok) {
        const msg = await resp.text();
        throw new Error('HTTP ' + resp.status + ': ' + msg);
      }

      if (stream) {
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let stream_done = false;
        while (!stream_done) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop();
          for (const block of parts) {
            const line = block.trim();
            if (!line.startsWith('data:')) continue;
            const data = line.slice(5).trim();
            if (data === '[DONE]') { stream_done = true; break; }
            try {
              const j = JSON.parse(data);
              const delta = j.choices?.[0]?.delta?.content || '';
              assistantText += delta;
              updateLastAssistantHTML(renderAssistantStreaming(assistantText));
              if (j.artifacts) renderArtifacts(j.artifacts);
            } catch (err) { console.warn('parse chunk failed', err); }
          }
        }
      } else {
        const j = await resp.json();
        assistantText = j.choices?.[0]?.message?.content || '';
        updateLastAssistantHTML(renderAssistantStreaming(assistantText));
        if (j.artifacts) renderArtifacts(j.artifacts);
      }
      history.push({ role: 'assistant', content: assistantText });
    } catch (err) {
      updateLastAssistantHTML(escapeHtml(t.statusError + err.message));
    } finally {
      sendBtn.disabled = false;
    }
  }

  function handleSendClick() {
    const text = input.value;
    input.value = '';
    sendMessage(text);
  }

  /**
   * Keyboard Shortcut Logic
   */
  input.addEventListener('keydown', (e) => {
    if (currentShortcut === 'enter') {
      if (e.key === 'Enter' && !e.altKey && !e.shiftKey) {
        e.preventDefault();
        handleSendClick();
      } else if (e.key === 'Enter' && e.altKey) {
        // Alt+Enter for New Line
        const start = input.selectionStart;
        input.value = input.value.substring(0, start) + "\n" + input.value.substring(input.selectionEnd);
        input.selectionStart = input.selectionEnd = start + 1;
      }
    } else {
      // Alt+Enter for Send
      if (e.key === 'Enter' && e.altKey) {
        e.preventDefault();
        handleSendClick();
      }
    }
  });
</script>

</body>
</html>
